<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mellotron Mobile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            color: #eee;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Top Controls Area --- */
        #controls-area {
            height: 40vh;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow-y: auto;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sound Selectors */
        .sound-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: #000;
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 5px;
        }

        .sound-name {
            font-size: 0.8rem;
            color: #5cf;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            text-align: center;
        }

        .nav-btn {
            background: #333;
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:active {
            background: #555;
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
            margin: 10px 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #eee;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* --- Keyboard Area --- */
        #keyboard-area {
            flex: 1;
            background: #000;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            /* Hide scrollbar */
            scrollbar-width: none;
        }

        #keyboard-area::-webkit-scrollbar {
            display: none;
        }

        .keyboard-scroll-container {
            display: flex;
            height: 100%;
            padding-left: 40px;
            /* Extra padding for first keys */
            padding-right: 40px;
            position: relative;
            align-items: flex-start;
        }

        /* Keys - Minimalist Style */
        .key {
            position: relative;
            float: left;
            border-radius: 0 0 8px 8px;
            transition: transform 0.05s, background-color 0.1s;
        }

        .white-key {
            width: 60px;
            height: 95%;
            /* Slightly shorter than full height */
            background: #e0e0e0;
            margin-right: 2px;
            z-index: 1;
        }

        .white-key.active {
            background: #bbb;
            transform: scale(0.98);
        }

        .black-key {
            width: 40px;
            height: 60%;
            background: #333;
            position: absolute;
            z-index: 2;
            border-radius: 0 0 6px 6px;
            /* Shadow for depth */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .black-key.active {
            background: #111;
            transform: translateY(2px);
        }

        /* Unmute Overlay */
        #unmute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        #unmute-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4);
        }
    </style>
</head>

<body>

    <div id="controls-area">
        <!-- Sound Selection -->
        <div class="row">
            <div class="card">
                <div class="label">SOUND A</div>
                <div class="sound-selector">
                    <button class="nav-btn" onclick="rotateEncoder('A', -1)">‹</button>
                    <div class="sound-name" id="nameA">Flute</div>
                    <button class="nav-btn" onclick="rotateEncoder('A', 1)">›</button>
                </div>
            </div>
            <div class="card">
                <div class="label">SOUND B</div>
                <div class="sound-selector">
                    <button class="nav-btn" onclick="rotateEncoder('B', -1)">‹</button>
                    <div class="sound-name" id="nameB">Organ</div>
                    <button class="nav-btn" onclick="rotateEncoder('B', 1)">›</button>
                </div>
            </div>
        </div>

        <!-- Mix & Vol -->
        <div class="row">
            <div class="card">
                <div class="label">MIX</div>
                <input type="range" id="mixKnob" min="0" max="100" value="50" oninput="updateParams()">
            </div>
            <div class="card">
                <div class="label">VOLUME</div>
                <input type="range" id="volKnob" min="0" max="100" value="80" oninput="updateParams()">
            </div>
        </div>

        <!-- Effects -->
        <div class="row">
            <div class="card">
                <div class="label">PITCH</div>
                <input type="range" id="pitchKnob" min="0" max="100" value="50" oninput="updateParams()">
            </div>
            <div class="card">
                <div class="label">TONE</div>
                <input type="range" id="toneKnob" min="0" max="100" value="100" oninput="updateParams()">
            </div>
            <div class="card">
                <div class="label">REVERB</div>
                <input type="range" id="reverbKnob" min="0" max="100" value="0" oninput="updateParams()">
            </div>
        </div>
    </div>

    <div id="keyboard-area">
        <div class="keyboard-scroll-container" id="keyboardContainer">
            <!-- Keys generated by JS -->
        </div>

        <div id="unmute-overlay" style="display: none;">
            <button id="unmute-btn">TAP TO ENABLE AUDIO</button>
        </div>
    </div>

    <div id="loading"
        style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 20px; border-radius:20px; font-size:0.8rem; z-index:200;">
        Loading...</div>

    <script>
        // --- Audio Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioContext();

        const masterGain = actx.createGain();
        const toneFilter = actx.createBiquadFilter();
        toneFilter.type = "lowpass";

        const convolver = actx.createConvolver();
        const reverbDryGain = actx.createGain();
        const reverbWetGain = actx.createGain();

        // Impulse Response
        const rate = actx.sampleRate;
        const length = rate * 2.0;
        const impulse = actx.createBuffer(2, length, rate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);
        for (let i = 0; i < length; i++) {
            const decay = Math.pow(1 - i / length, 2);
            left[i] = (Math.random() * 2 - 1) * decay;
            right[i] = (Math.random() * 2 - 1) * decay;
        }
        convolver.buffer = impulse;

        masterGain.connect(toneFilter);
        toneFilter.connect(reverbDryGain);
        toneFilter.connect(convolver);
        convolver.connect(reverbWetGain);
        reverbDryGain.connect(actx.destination);
        reverbWetGain.connect(actx.destination);

        // Instruments
        const instruments = [
            "8 Choir", "Bassoon", "Cello", "Combined Choir", "GC3 Brass",
            "M300A", "M300B", "Mixed Brass B", "Mixed Brass B 2",
            "MkII Church Organ", "MkII Combined Brass", "MkII Flute",
            "MkII Violins", "Orchestra", "String Section", "Tenor & Alto Sax",
            "Tenor Sax", "Trombone", "Trombone & Trumpet", "Trumpet", "Woodwind 2"
        ];

        let state = {
            idxA: 11, idxB: 9, mix: 0.5, pitch: 1.0, tone: 1.0, vol: 0.8, reverb: 0.0, octave: 3
        };

        let activeNotes = {};
        let sampleBuffers = {};
        let isLoading = false;

        function noteNameToMidi(name) {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const regex = /([A-G]#?)(\d)/;
            const match = name.match(regex);
            if (!match) return -1;
            const noteStr = match[1];
            const octave = parseInt(match[2]);
            const noteIdx = notes.indexOf(noteStr);
            return (octave + 1) * 12 + noteIdx;
        }

        const fileList = [
            "A#2.wav", "A#3.wav", "A#4.wav", "A2.wav", "A3.wav", "A4.wav",
            "B2.wav", "B3.wav", "B4.wav", "C#3.wav", "C#4.wav", "C#5.wav",
            "C3.wav", "C4.wav", "C5.wav", "D#3.wav", "D#4.wav", "D#5.wav",
            "D3.wav", "D4.wav", "D5.wav", "E3.wav", "E4.wav", "E5.wav",
            "F#3.wav", "F#4.wav", "F3.wav", "F4.wav", "F5.wav",
            "G#2.wav", "G#3.wav", "G#4.wav", "G2.wav", "G3.wav", "G4.wav"
        ];

        async function loadInstrument(instName) {
            if (sampleBuffers[instName]) return;
            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = `Loading ${instName}...`;
            sampleBuffers[instName] = {};

            const promises = fileList.map(async (file) => {
                const noteName = file.replace(".wav", "");
                const midiNote = noteNameToMidi(noteName);
                if (midiNote === -1) return;
                try {
                    const safeFile = file.replace("#", "%23");
                    const safeInst = encodeURIComponent(instName);
                    const response = await fetch(`Samples/${safeInst}/${safeFile}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await actx.decodeAudioData(arrayBuffer);
                    sampleBuffers[instName][midiNote] = audioBuffer;
                } catch (e) { console.warn(`Missing: ${instName}/${file}`); }
            });
            await Promise.all(promises);
            isLoading = false;
            document.getElementById('loading').style.display = 'none';
        }

        function playNote(midiNote) {
            if (actx.state === 'suspended') actx.resume();
            const playbackRate = state.pitch;

            const playVoice = (instIdx, mixLevel) => {
                const inst = instruments[instIdx];
                const buffer = sampleBuffers[inst] ? sampleBuffers[inst][midiNote] : null;
                if (!buffer) return null;
                const source = actx.createBufferSource();
                source.buffer = buffer;
                source.playbackRate.value = playbackRate;
                source.loop = true;
                const gain = actx.createGain();
                source.connect(gain);
                gain.connect(masterGain);
                source.start();
                const now = actx.currentTime;
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(mixLevel, now + 0.05);
                return { source, gain };
            };

            const vA = playVoice(state.idxA, (1.0 - state.mix) * 0.5);
            const vB = playVoice(state.idxB, state.mix * 0.5);
            activeNotes[midiNote] = {
                sourceA: vA ? vA.source : null, gainA: vA ? vA.gain : null,
                sourceB: vB ? vB.source : null, gainB: vB ? vB.gain : null
            };
        }

        function stopNote(midiNote) {
            const voice = activeNotes[midiNote];
            if (voice) {
                const now = actx.currentTime;
                const releaseTime = 0.1;
                const stopVoice = (vSource, vGain) => {
                    if (vSource) {
                        vGain.gain.cancelScheduledValues(now);
                        vGain.gain.setValueAtTime(vGain.gain.value, now);
                        vGain.gain.linearRampToValueAtTime(0, now + releaseTime);
                        vSource.stop(now + releaseTime + 0.05);
                    }
                };
                stopVoice(voice.sourceA, voice.gainA);
                stopVoice(voice.sourceB, voice.gainB);
                delete activeNotes[midiNote];
            }
        }

        // --- UI Logic ---
        function updateParams() {
            state.mix = parseInt(document.getElementById('mixKnob').value) / 100;
            state.vol = parseInt(document.getElementById('volKnob').value) / 100;

            const pVal = parseInt(document.getElementById('pitchKnob').value);
            state.pitch = Math.pow(2, (pVal - 50) / 33.3);

            const tVal = parseInt(document.getElementById('toneKnob').value) / 100;
            const cutoff = 200 * Math.pow(12000 / 200, tVal);
            toneFilter.frequency.setTargetAtTime(cutoff, actx.currentTime, 0.1);

            const rVal = parseInt(document.getElementById('reverbKnob').value) / 100;
            state.reverb = rVal;
            reverbDryGain.gain.setTargetAtTime(1.0 - rVal * 0.5, actx.currentTime, 0.1);
            reverbWetGain.gain.setTargetAtTime(rVal, actx.currentTime, 0.1);

            masterGain.gain.setTargetAtTime(state.vol, actx.currentTime, 0.1);
        }

        function rotateEncoder(side, dir) {
            if (side === 'A') {
                state.idxA += dir;
                if (state.idxA < 0) state.idxA = instruments.length - 1;
                if (state.idxA >= instruments.length) state.idxA = 0;
                document.getElementById('nameA').innerText = instruments[state.idxA];
                loadInstrument(instruments[state.idxA]);
            } else {
                state.idxB += dir;
                if (state.idxB < 0) state.idxB = instruments.length - 1;
                if (state.idxB >= instruments.length) state.idxB = 0;
                document.getElementById('nameB').innerText = instruments[state.idxB];
                loadInstrument(instruments[state.idxB]);
            }
        }

        // --- Keyboard Generation ---
        const keyboardContainer = document.getElementById('keyboardContainer');
        const startOctave = 2;
        const numOctaves = 3;

        for (let o = 0; o < numOctaves; o++) {
            const oct = startOctave + o;
            const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            notes.forEach((note, i) => {
                const whiteKey = document.createElement('div');
                whiteKey.className = 'key white-key';

                const baseOffsets = [0, 2, 4, 5, 7, 9, 11];
                const midi = (oct + 1) * 12 + baseOffsets[i];

                attachTouchEvents(whiteKey, midi);
                keyboardContainer.appendChild(whiteKey);

                if (note !== 'E' && note !== 'B') {
                    const blackKey = document.createElement('div');
                    blackKey.className = 'key black-key';
                    const blackMidi = midi + 1;

                    // Calculate position
                    const whiteIndex = (o * 7) + i;
                    // 60px width + 2px margin = 62px per white key step
                    const leftPos = (whiteIndex + 1) * 62 - 20 + 40; // +40 for container padding

                    blackKey.style.left = `${leftPos}px`;
                    attachTouchEvents(blackKey, blackMidi);
                    keyboardContainer.appendChild(blackKey);
                }
            });
        }

        // Width: 21 white keys * 62px + padding
        keyboardContainer.style.minWidth = `${(numOctaves * 7 * 62) + 80}px`;

        function attachTouchEvents(el, midiNote) {
            const start = (e) => {
                // e.preventDefault(); // Don't block scroll completely?
                // Only prevent default if it's not scrolling?
                // For keys, we usually want to prevent default to avoid scrolling while playing
                if (e.cancelable) e.preventDefault();
                el.classList.add('active');
                playNote(midiNote);
            };
            const end = (e) => {
                if (e.cancelable) e.preventDefault();
                el.classList.remove('active');
                stopNote(midiNote);
            };

            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);

            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', end, { passive: false });
            el.addEventListener('touchcancel', end, { passive: false });
        }

        // Init
        (async () => {
            const startA = instruments[state.idxA];
            const startB = instruments[state.idxB];
            document.getElementById('nameA').innerText = startA;
            document.getElementById('nameB').innerText = startB;

            await Promise.all([loadInstrument(startA), loadInstrument(startB)]);
            updateParams();

            // Audio Unlock
            const overlay = document.getElementById('unmute-overlay');
            const btn = document.getElementById('unmute-btn');

            const checkAudio = () => {
                if (actx.state === 'suspended') {
                    overlay.style.display = 'flex';
                } else {
                    overlay.style.display = 'none';
                }
            };

            const unlock = async () => {
                await actx.resume();
                checkAudio();
            };

            btn.addEventListener('click', unlock);
            btn.addEventListener('touchstart', unlock);

            document.body.addEventListener('touchstart', async () => {
                if (actx.state === 'suspended') await actx.resume();
                checkAudio();
            }, { once: true });

            checkAudio();
        })();

    </script>
</body>

</html>
