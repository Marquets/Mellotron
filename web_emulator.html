<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellotron Micro Web Emulator</title>
    <style>
        body {
            background-color: #222;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* --- Hardware Layout --- */
        .hardware-case {
            background-color: #333;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* --- Screens --- */
        .screens-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .oled-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .oled-container {
            width: 256px;
            /* 128 * 2 */
            height: 128px;
            /* 64 * 2 */
            background-color: #000;
            border: 4px solid #555;
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        /* --- Controls --- */
        .controls-row {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Knobs (Simulated with Range for now) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100px;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #eee;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        /* Encoders */
        .encoder-btn {
            background: #444;
            border: 2px solid #666;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }

        .encoder-btn:active {
            background: #666;
        }

        .encoder-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        /* Keyboard */
        .keyboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .octave-display {
            font-family: monospace;
            color: #5cf;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .keyboard-container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .keys-row {
            display: flex;
            gap: 5px;
        }

        .key {
            width: 40px;
            height: 60px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: bold;
            user-select: none;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .key:active,
        .key.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0.5);
        }

        .key.white {
            background: #eee;
            color: #333;
            height: 60px;
        }

        .key.black {
            background: #333;
            color: #eee;
            height: 50px;
            border: 1px solid #555;
        }

        .spacer {
            width: 40px;
            height: 0;
            visibility: hidden;
        }
    </style>
</head>

<body>

    <h1>Mellotron Micro Emulator</h1>

    <div class="hardware-case">

        <!-- Screens -->
        <div class="screens-row">
            <div class="oled-wrapper">
                <div class="label">DISPLAY A</div>
                <div class="oled-container">
                    <canvas id="oledCanvasA" width="128" height="64"
                        style="width: 100%; height: 100%; image-rendering: pixelated;"></canvas>
                </div>
            </div>
            <div class="oled-wrapper">
                <div class="label">DISPLAY B</div>
                <div class="oled-container">
                    <canvas id="oledCanvasB" width="128" height="64"
                        style="width: 100%; height: 100%; image-rendering: pixelated;"></canvas>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-row">
            <!-- Sound Selectors -->
            <div class="control-group">
                <div class="label">SELECT A</div>
                <div class="encoder-row">
                    <button class="encoder-btn" onclick="rotateEncoder('A', -1)">◀</button>
                    <span id="labelA">Flute</span>
                    <button class="encoder-btn" onclick="rotateEncoder('A', 1)">▶</button>
                </div>
            </div>

            <div class="control-group">
                <div class="label">SELECT B</div>
                <div class="encoder-row">
                    <button class="encoder-btn" onclick="rotateEncoder('B', -1)">◀</button>
                    <span id="labelB">Violins</span>
                    <button class="encoder-btn" onclick="rotateEncoder('B', 1)">▶</button>
                </div>
            </div>
        </div>

        <div class="controls-row">
            <div class="control-group">
                <div class="label">MIX</div>
                <input type="range" id="mixKnob" min="0" max="100" value="50" oninput="updateParams()">
            </div>
            <div class="control-group">
                <div class="label">PITCH</div>
                <input type="range" id="pitchKnob" min="0" max="100" value="50" oninput="updateParams()">
            </div>
            <div class="control-group">
                <div class="label">TONE</div>
                <input type="range" id="toneKnob" min="0" max="100" value="100" oninput="updateParams()">
            </div>
            <div class="control-group">
                <div class="label">VOLUME</div>
                <input type="range" id="volKnob" min="0" max="100" value="80" oninput="updateParams()">
            </div>
        </div>

        <!-- Effects Row -->
        <div class="controls-row" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
            <div class="control-group">
                <div class="label" style="color: #fca;">REVERB</div>
                <input type="range" id="reverbKnob" min="0" max="100" value="0" oninput="updateParams()">
            </div>
        </div>

        <!-- Virtual Keyboard -->
        <div class="keyboard-wrapper">
            <div class="octave-display" id="octaveDisplay">Octave: C3</div>
            <div class="keyboard-container">
                <div class="keys-row" id="blackKeysRow"></div>
                <div class="keys-row" id="whiteKeysRow"></div>
            </div>
        </div>

        <div style="font-size: 0.8rem; color: #666; margin-top: 10px; text-align: center;">
            <span style="color: #fff">Z</span> / <span style="color: #fff">X</span> to change Octave
        </div>

        <!-- MIDI Status -->
        <div id="midiStatus"
            style="margin-top: 15px; padding: 10px; background: #222; border-radius: 5px; font-size: 0.9rem;">
            <span style="color: #888;">MIDI: </span><span id="midiStatusText" style="color: #f66;">Not Connected</span>
        </div>
    </div>

    <div id="loading">Loading samples...</div>

    <script>
        // --- Audio Engine (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioContext();

        // Master Chain
        const masterGain = actx.createGain();
        const toneFilter = actx.createBiquadFilter();
        toneFilter.type = "lowpass";

        // Reverb Nodes
        const convolver = actx.createConvolver();
        const reverbDryGain = actx.createGain();
        const reverbWetGain = actx.createGain();

        // Generate Impulse Response for Reverb (Simple Room)
        const rate = actx.sampleRate;
        const length = rate * 2.0; // 2 seconds
        const impulse = actx.createBuffer(2, length, rate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);
        for (let i = 0; i < length; i++) {
            const decay = Math.pow(1 - i / length, 2); // Exponential decay
            left[i] = (Math.random() * 2 - 1) * decay;
            right[i] = (Math.random() * 2 - 1) * decay;
        }
        convolver.buffer = impulse;

        // Routing
        masterGain.connect(toneFilter);

        // Split to Dry/Wet
        toneFilter.connect(reverbDryGain);
        toneFilter.connect(convolver);
        convolver.connect(reverbWetGain);

        reverbDryGain.connect(actx.destination);
        reverbWetGain.connect(actx.destination);

        // State
        // Full list of instruments from the samples folder
        const instruments = [
            "8 Choir", "Bassoon", "Cello", "Combined Choir", "GC3 Brass",
            "M300A", "M300B", "Mixed Brass B", "Mixed Brass B 2",
            "MkII Church Organ", "MkII Combined Brass", "MkII Flute",
            "MkII Violins", "Orchestra", "String Section", "Tenor & Alto Sax",
            "Tenor Sax", "Trombone", "Trombone & Trumpet", "Trumpet", "Woodwind 2"
        ];

        let state = {
            idxA: 11, // Default to MkII Flute
            idxB: 12, // Default to MkII Violins
            mix: 0.5,
            pitch: 1.0,
            tone: 1.0,
            vol: 0.8,
            reverb: 0.0,
            octave: 3 // Default C3
        };

        let activeNotes = {};
        let sampleBuffers = {}; // { "InstrumentName": { midiNote: AudioBuffer } }
        let isLoading = false;

        // Note mapping helper
        function noteNameToMidi(name) {
            // e.g. "C#3", "A2"
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const regex = /([A-G]#?)(\d)/;
            const match = name.match(regex);
            if (!match) return -1;

            const noteStr = match[1];
            const octave = parseInt(match[2]);
            const noteIdx = notes.indexOf(noteStr);

            // MIDI note calculation: (Octave + 1) * 12 + NoteIdx
            return (octave + 1) * 12 + noteIdx;
        }

        // Hardcoded file list based on directory scan
        const fileList = [
            "A#2.wav", "A#3.wav", "A#4.wav", "A2.wav", "A3.wav", "A4.wav",
            "B2.wav", "B3.wav", "B4.wav", "C#3.wav", "C#4.wav", "C#5.wav",
            "C3.wav", "C4.wav", "C5.wav", "D#3.wav", "D#4.wav", "D#5.wav",
            "D3.wav", "D4.wav", "D5.wav", "E3.wav", "E4.wav", "E5.wav",
            "F#3.wav", "F#4.wav", "F3.wav", "F4.wav", "F5.wav",
            "G#2.wav", "G#3.wav", "G#4.wav", "G2.wav", "G3.wav", "G4.wav"
        ];

        async function loadInstrument(instName) {
            if (sampleBuffers[instName]) return; // Already loaded

            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = `Loading ${instName}...`;

            sampleBuffers[instName] = {};

            const promises = fileList.map(async (file) => {
                const noteName = file.replace(".wav", "");
                const midiNote = noteNameToMidi(noteName);
                if (midiNote === -1) return;

                try {
                    // Fix: Escape '#' in filenames as it's a URL fragment identifier
                    const safeFile = file.replace("#", "%23");
                    const response = await fetch(`samples/${instName}/${safeFile}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await actx.decodeAudioData(arrayBuffer);
                    sampleBuffers[instName][midiNote] = audioBuffer;
                } catch (e) {
                    console.warn(`Missing sample: ${instName}/${file}`);
                }
            });

            await Promise.all(promises);

            isLoading = false;
            document.getElementById('loading').style.display = 'none';
            console.log(`${instName} loaded!`);
        }

        function playNote(midiNote) {
            // if (isLoading) return; // Allow playing previous loaded sounds while loading?
            if (actx.state === 'suspended') actx.resume();

            // Playback rate affects pitch
            const playbackRate = state.pitch;

            // Helper to play voice
            const playVoice = (instIdx, mixLevel) => {
                const inst = instruments[instIdx];
                const buffer = sampleBuffers[inst] ? sampleBuffers[inst][midiNote] : null;
                if (!buffer) return null;

                const source = actx.createBufferSource();
                source.buffer = buffer;
                source.playbackRate.value = playbackRate;
                source.loop = true;
                const gain = actx.createGain();
                source.connect(gain);
                gain.connect(masterGain);
                source.start();

                // Envelope (Attack)
                const now = actx.currentTime;
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(mixLevel, now + 0.05); // Fast attack
                return { source, gain };
            };

            const vA = playVoice(state.idxA, (1.0 - state.mix) * 0.5);
            const vB = playVoice(state.idxB, state.mix * 0.5);

            activeNotes[midiNote] = {
                sourceA: vA ? vA.source : null, gainA: vA ? vA.gain : null,
                sourceB: vB ? vB.source : null, gainB: vB ? vB.gain : null
            };
        }

        function stopNote(midiNote) {
            const voice = activeNotes[midiNote];
            if (voice) {
                const now = actx.currentTime;
                const releaseTime = 0.1; // 100ms release to avoid clicks

                const stopVoice = (vSource, vGain) => {
                    if (vSource) {
                        vGain.gain.cancelScheduledValues(now);
                        vGain.gain.setValueAtTime(vGain.gain.value, now); // Anchor current value
                        vGain.gain.linearRampToValueAtTime(0, now + releaseTime);
                        vSource.stop(now + releaseTime + 0.05); // Stop slightly after release
                    }
                };
                stopVoice(voice.sourceA, voice.gainA);
                stopVoice(voice.sourceB, voice.gainB);
                delete activeNotes[midiNote];
            }
        }

        // --- UI Logic ---
        const ctxA = document.getElementById('oledCanvasA').getContext('2d');
        const ctxB = document.getElementById('oledCanvasB').getContext('2d');

        function updateParams() {
            state.mix = parseInt(document.getElementById('mixKnob').value) / 100;
            state.vol = parseInt(document.getElementById('volKnob').value) / 100;

            // Pitch: Center (50) = 1.0x. Range approx 0.35x to 2.8x
            // Formula: 2 ^ ((val - 50) / 33.3)
            const pVal = parseInt(document.getElementById('pitchKnob').value);
            state.pitch = Math.pow(2, (pVal - 50) / 33.3);

            // Tone: 200Hz to 12000Hz Log
            const tVal = parseInt(document.getElementById('toneKnob').value) / 100;
            const cutoff = 200 * Math.pow(12000 / 200, tVal);
            toneFilter.frequency.setTargetAtTime(cutoff, actx.currentTime, 0.1);

            masterGain.gain.setTargetAtTime(state.vol, actx.currentTime, 0.1);

            // Reverb Mix
            const rVal = parseInt(document.getElementById('reverbKnob').value) / 100;
            state.reverb = rVal;
            reverbDryGain.gain.setTargetAtTime(1.0 - rVal * 0.5, actx.currentTime, 0.1); // Reduce dry slightly as wet increases
            reverbWetGain.gain.setTargetAtTime(rVal, actx.currentTime, 0.1);

            // Update active voices
            for (let note in activeNotes) {
                const v = activeNotes[note];
                if (v.gainA) v.gainA.gain.setTargetAtTime((1.0 - state.mix) * 0.5, actx.currentTime, 0.1);
                if (v.gainB) v.gainB.gain.setTargetAtTime(state.mix * 0.5, actx.currentTime, 0.1);

                if (v.sourceA) v.sourceA.playbackRate.setTargetAtTime(state.pitch, actx.currentTime, 0.1);
                if (v.sourceB) v.sourceB.playbackRate.setTargetAtTime(state.pitch, actx.currentTime, 0.1);
            }

            drawOLEDs();
        }

        function rotateEncoder(side, dir) {
            if (side === 'A') {
                state.idxA += dir;
                if (state.idxA < 0) state.idxA = instruments.length - 1;
                if (state.idxA >= instruments.length) state.idxA = 0;

                const instName = instruments[state.idxA];
                document.getElementById('labelA').innerText = instName;
                loadInstrument(instName); // Lazy load
            } else {
                state.idxB += dir;
                if (state.idxB < 0) state.idxB = instruments.length - 1;
                if (state.idxB >= instruments.length) state.idxB = 0;

                const instName = instruments[state.idxB];
                document.getElementById('labelB').innerText = instName;
                loadInstrument(instName); // Lazy load
            }
            drawOLEDs();
        }

        // --- OLED Drawing (Ported from C++) ---
        function drawText(ctx, text, x, y, size) {
            ctx.font = size === 'small' ? '8px monospace' : '10px monospace';
            ctx.fillStyle = '#5cf';
            ctx.fillText(text, x, y + 8);
        }
        function drawRect(ctx, x, y, w, h, fill) {
            ctx.strokeStyle = '#5cf';
            ctx.fillStyle = '#5cf';
            if (fill) ctx.fillRect(x, y, w, h);
            else ctx.strokeRect(x + 0.5, y + 0.5, w, h);
        }

        function drawOLEDs() {
            // --- Display A ---
            ctxA.fillStyle = '#000'; ctxA.fillRect(0, 0, 128, 64);
            const instA = instruments[state.idxA];
            const mixPctA = Math.round((1.0 - state.mix) * 100);

            const titleW = 7 * 7;
            const titleX = ((128 - titleW) / 2) + 10;
            drawText(ctxA, "Sound A", titleX, 5, 'small');

            const instW = instA.length * 11;
            const instX = Math.max(0, (128 - instW) / 2) + 10;
            drawText(ctxA, instA, instX, 25, 'large');

            drawText(ctxA, "Mix", 10, 52, 'small');
            const barW = 50;
            const fillWA = (barW * mixPctA) / 100;
            drawRect(ctxA, 35, 54, barW, 6, false);
            if (fillWA > 0) drawRect(ctxA, 35, 54, fillWA, 6, true);
            drawText(ctxA, `${mixPctA}%`, 90, 52, 'small');

            // --- Display B ---
            ctxB.fillStyle = '#000'; ctxB.fillRect(0, 0, 128, 64);
            const instB = instruments[state.idxB];
            const mixPctB = Math.round(state.mix * 100);

            drawText(ctxB, "Sound B", titleX, 5, 'small');
            const instWB = instB.length * 11;
            const instXB = Math.max(0, (128 - instWB) / 2) + 10;
            drawText(ctxB, instB, instXB, 25, 'large');

            drawText(ctxB, "Mix", 10, 52, 'small');
            const fillWB = (barW * mixPctB) / 100;
            drawRect(ctxB, 35, 54, barW, 6, false);
            if (fillWB > 0) drawRect(ctxB, 35, 54, fillWB, 6, true);
            drawText(ctxB, `${mixPctB}%`, 90, 52, 'small');
        }

        // --- Keyboard Generation ---
        const blackKeysRow = document.getElementById('blackKeysRow');
        const whiteKeysRow = document.getElementById('whiteKeysRow');
        const octaveDisplay = document.getElementById('octaveDisplay');

        // Layout: 
        // Black: W E   T Y U
        // White: A S D F G H J K

        // We need to generate keys in order but place them in different rows
        // White keys map to offsets: 0, 2, 4, 5, 7, 9, 11, 12 (C, D, E, F, G, A, B, C)
        // Black keys map to offsets: 1, 3, 6, 8, 10

        const whiteKeyDefs = [
            { label: 'A', offset: 0 }, { label: 'S', offset: 2 }, { label: 'D', offset: 4 },
            { label: 'F', offset: 5 }, { label: 'G', offset: 7 }, { label: 'H', offset: 9 },
            { label: 'J', offset: 11 }, { label: 'K', offset: 12 }
        ];

        const blackKeyDefs = [
            { label: 'W', offset: 1 }, { label: 'E', offset: 3 },
            { spacer: true }, // Gap between E and T
            { label: 'T', offset: 6 }, { label: 'Y', offset: 8 }, { label: 'U', offset: 10 }
        ];

        // Generate White Keys
        whiteKeyDefs.forEach(def => {
            const div = document.createElement('div');
            div.className = 'key white';
            div.innerText = def.label;
            div.dataset.offset = def.offset;
            attachEvents(div, def.offset);
            whiteKeysRow.appendChild(div);
        });

        // Generate Black Keys
        blackKeyDefs.forEach(def => {
            if (def.spacer) {
                const div = document.createElement('div');
                div.className = 'spacer';
                blackKeysRow.appendChild(div);
            } else {
                const div = document.createElement('div');
                div.className = 'key black';
                div.innerText = def.label;
                div.dataset.offset = def.offset;
                attachEvents(div, def.offset);
                blackKeysRow.appendChild(div);
            }
        });

        function attachEvents(div, offset) {
            div.onmousedown = (e) => {
                e.preventDefault();
                div.classList.add('active');
                playNoteFromOffset(offset);
            };
            div.onmouseup = () => {
                div.classList.remove('active');
                stopNoteFromOffset(offset);
            };
            div.onmouseleave = () => {
                if (div.classList.contains('active')) {
                    div.classList.remove('active');
                    stopNoteFromOffset(offset);
                }
            };
        }

        // Key Map for Computer Keyboard
        const keyMap = {
            'a': 0, 's': 2, 'd': 4, 'f': 5, 'g': 7, 'h': 9, 'j': 11, 'k': 12,
            'w': 1, 'e': 3, 't': 6, 'y': 8, 'u': 10
        };

        function playNoteFromOffset(offset) {
            // Calculate MIDI note based on current octave
            // C3 = 60. Octave 3.
            // Formula: (Octave + 1) * 12 + Offset
            const midiNote = (state.octave + 1) * 12 + offset;
            playNote(midiNote);
        }

        function stopNoteFromOffset(offset) {
            const midiNote = (state.octave + 1) * 12 + offset;
            stopNote(midiNote);
        }

        function updateOctaveDisplay() {
            octaveDisplay.innerText = `Octave: C${state.octave}`;
        }

        // Computer Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;

            // Octave Switching
            if (e.key.toLowerCase() === 'z') {
                state.octave = Math.max(1, state.octave - 1);
                updateOctaveDisplay();
                return;
            }
            if (e.key.toLowerCase() === 'x') {
                state.octave = Math.min(6, state.octave + 1);
                updateOctaveDisplay();
                return;
            }

            const offset = keyMap[e.key.toLowerCase()];
            if (offset !== undefined) {
                const div = document.querySelector(`.key[data-offset="${offset}"]`);
                if (div) div.classList.add('active');
                playNoteFromOffset(offset);
            }
        });
        document.addEventListener('keyup', (e) => {
            const offset = keyMap[e.key.toLowerCase()];
            if (offset !== undefined) {
                const div = document.querySelector(`.key[data-offset="${offset}"]`);
                if (div) div.classList.remove('active');
                stopNoteFromOffset(offset);
            }
        });

        // --- Web MIDI API Support ---
        let midiAccess = null;

        async function initMIDI() {
            if (!navigator.requestMIDIAccess) {
                document.getElementById('midiStatusText').innerText = 'Not Supported';
                document.getElementById('midiStatusText').style.color = '#888';
                return;
            }

            try {
                midiAccess = await navigator.requestMIDIAccess();
                console.log('MIDI Access granted');

                // Listen to all inputs
                midiAccess.inputs.forEach(input => {
                    console.log(`MIDI Input: ${input.name}`);
                    input.onmidimessage = onMIDIMessage;
                });

                // Update status
                updateMIDIStatus();

                // Listen for device changes
                midiAccess.onstatechange = (e) => {
                    console.log(`MIDI Device ${e.port.state}: ${e.port.name}`);
                    if (e.port.type === 'input') {
                        if (e.port.state === 'connected') {
                            e.port.onmidimessage = onMIDIMessage;
                        }
                        updateMIDIStatus();
                    }
                };

            } catch (err) {
                console.error('MIDI Access failed:', err);
                document.getElementById('midiStatusText').innerText = 'Access Denied';
                document.getElementById('midiStatusText').style.color = '#f66';
            }
        }

        function updateMIDIStatus() {
            const inputs = Array.from(midiAccess.inputs.values());
            const statusText = document.getElementById('midiStatusText');

            if (inputs.length === 0) {
                statusText.innerText = 'No Devices';
                statusText.style.color = '#f90';
            } else {
                const deviceNames = inputs.map(i => i.name).join(', ');
                statusText.innerText = `✓ ${deviceNames}`;
                statusText.style.color = '#5f5';
            }
        }

        function onMIDIMessage(event) {
            const [status, note, velocity] = event.data;

            // MIDI Status Byte: 
            // 0x90-0x9F = Note On (channel 1-16)
            // 0x80-0x8F = Note Off (channel 1-16)

            const command = status & 0xF0;

            if (command === 0x90 && velocity > 0) {
                // Note On
                const midiNote = note + (state.octave - 3) * 12; // Apply octave offset (default is C3)
                playNote(midiNote);
            } else if (command === 0x80 || (command === 0x90 && velocity === 0)) {
                // Note Off
                const midiNote = note + (state.octave - 3) * 12;
                stopNote(midiNote);
            }
        }

        // Init
        (async () => {
            const startA = instruments[state.idxA];
            const startB = instruments[state.idxB];
            document.getElementById('labelA').innerText = startA;
            document.getElementById('labelB').innerText = startB;
            await Promise.all([loadInstrument(startA), loadInstrument(startB)]);
            updateParams();
            updateOctaveDisplay();

            // Initialize MIDI
            await initMIDI();
        })();


    </script>
</body>
