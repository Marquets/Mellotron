<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLED Preview</title>
    <style>
        body {
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #eee;
            font-family: sans-serif;
        }

        .screens-container {
            display: flex;
            gap: 20px;
        }

        .oled-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .oled-container {
            width: 256px;
            /* 128 * 2 */
            height: 128px;
            /* 64 * 2 */
            background-color: #000;
            position: relative;
            border: 4px solid #444;
        }

        h2 {
            margin-bottom: 5px;
            font-size: 1rem;
            color: #888;
        }

        .pixel-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(128, 1fr);
            grid-template-rows: repeat(64, 1fr);
        }

        .pixel {
            background-color: #000;
        }

        .pixel.on {
            background-color: #5cf;
            /* Cyan-ish OLED color */
            box-shadow: 0 0 2px #5cf;
        }

        /* Simulation of the drawing logic */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <h1>Dual OLED Simulator</h1>

    <div class="screens-container">
        <div class="oled-wrapper">
            <h2>Display A (0x3C)</h2>
            <div class="oled-container">
                <canvas id="oledCanvasA" width="128" height="64"
                    style="width: 100%; height: 100%; image-rendering: pixelated;"></canvas>
            </div>
        </div>
        <div class="oled-wrapper">
            <h2>Display B (0x3D)</h2>
            <div class="oled-container">
                <canvas id="oledCanvasB" width="128" height="64"
                    style="width: 100%; height: 100%; image-rendering: pixelated;"></canvas>
            </div>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <label>Sound A: <select id="selA" onchange="updateDisplay()"></select></label>
        <label>Sound B: <select id="selB" onchange="updateDisplay()"></select></label>
    </div>
    <div style="margin-top: 10px;">
        <label>Crossfade: <input type="range" id="mixKnob" min="0" max="100" value="50"
                oninput="updateDisplay()"></label>
    </div>

    <script>
        const ctxA = document.getElementById('oledCanvasA').getContext('2d');
        const ctxB = document.getElementById('oledCanvasB').getContext('2d');

        // Font simulation (simplified)
        function drawText(ctx, text, x, y, size) {
            ctx.font = size === 'small' ? '8px monospace' : '10px monospace';
            ctx.fillStyle = '#5cf';
            ctx.fillText(text, x, y + 8);
        }

        function drawRect(ctx, x, y, w, h, fill) {
            ctx.strokeStyle = '#5cf';
            ctx.fillStyle = '#5cf';
            if (fill) {
                ctx.fillRect(x, y, w, h);
            } else {
                ctx.strokeRect(x + 0.5, y + 0.5, w, h); // +0.5 for crisp lines
            }
        }

        const instruments = ["Flute", "Violins", "Cello", "Choir", "Brass", "Organ", "Vibes", "Piano"];

        // Populate selectors
        const selA = document.getElementById('selA');
        const selB = document.getElementById('selB');
        instruments.forEach((inst, i) => {
            selA.add(new Option(inst, i));
            selB.add(new Option(inst, i));
        });
        selB.selectedIndex = 1; // Default to Violins

        const mixKnob = document.getElementById('mixKnob');

        function updateDisplay() {
            // --- Display A ---
            ctxA.fillStyle = '#000';
            ctxA.fillRect(0, 0, 128, 64);

            const instA = instruments[selA.value];
            const mixVal = parseInt(mixKnob.value);
            const mixPctA = 100 - mixVal;

            // Centered Title
            const titleW = 7 * 7;
            const titleX = ((128 - titleW) / 2) + 10;
            drawText(ctxA, "Sound A", titleX, 5, 'small');

            // Centered Instrument
            const instW = instA.length * 11; // Approx width for large font
            const instX = Math.max(0, (128 - instW) / 2) + 10;
            drawText(ctxA, instA, instX, 25, 'large');

            // Bottom Row
            drawText(ctxA, "Mix", 10, 52, 'small');

            const barW = 50;
            const fillWA = (barW * mixPctA) / 100;
            drawRect(ctxA, 35, 54, barW, 6, false); // Frame
            if (fillWA > 0) drawRect(ctxA, 35, 54, fillWA, 6, true); // Fill

            drawText(ctxA, `${mixPctA}%`, 90, 52, 'small');

            // --- Display B ---
            ctxB.fillStyle = '#000';
            ctxB.fillRect(0, 0, 128, 64);

            const instB = instruments[selB.value];
            const mixPctB = mixVal;

            // Centered Title
            drawText(ctxB, "Sound B", titleX, 5, 'small');

            // Centered Instrument
            const instWB = instB.length * 11;
            const instXB = Math.max(0, (128 - instWB) / 2) + 10;
            drawText(ctxB, instB, instXB, 25, 'large');

            // Bottom Row
            drawText(ctxB, "Mix", 10, 52, 'small');

            const fillWB = (barW * mixPctB) / 100;
            drawRect(ctxB, 35, 54, barW, 6, false); // Frame
            if (fillWB > 0) drawRect(ctxB, 35, 54, fillWB, 6, true); // Fill

            drawText(ctxB, `${mixPctB}%`, 90, 52, 'small');
        }

        // Initial draw
        updateDisplay();
    </script>
</body>

</html>
